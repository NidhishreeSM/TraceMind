services:
  postgres:
    image: postgres:16-alpine
    container_name: tracemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracemind
      POSTGRES_PASSWORD: tracemind_password
      POSTGRES_DB: tracemind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracemind -d tracemind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
